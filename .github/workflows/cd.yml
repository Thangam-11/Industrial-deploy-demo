name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: industrial-demo-project
  ACR_NAME: industrialacrdemoprojectacr
  BACKEND_APP: industrial-backend-demo
  FRONTEND_APP: industrial-frontend-demo

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Backend Image
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image backend:$SHA \
            --file backend/Dockerfile .

      - name: Build and Push Frontend Image
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image frontend:$SHA \
            --file frontend/Dockerfile ./frontend

      - name: Deploy Backend Container
        run: |
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/backend:$SHA

      - name: Deploy Frontend Container
        run: |
          az containerapp update \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/frontend:$SHA

      - name: Get Backend URL
        run: |
          echo "Backend URL:"
          az containerapp show \
            --name $BACKEND_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv

      - name: Get Frontend URL
        run: |
          echo "Frontend URL:"
          az containerapp show \
            --name $FRONTEND_APP \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv